plugins { id 'com.android.application' }
android {
    namespace 'com.ticklect.kart64'
    compileSdk 37
    defaultConfig { applicationId 'com.ticklect.kart64'; minSdk 26; targetSdk 36; versionCode 6; versionName '1.0.1' }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    // Smaller sideload downloads; Android extracts native libraries at install time.
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress += ['wasm','o2r','data'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
